name: Daily Digest

on:
  schedule:
    # GitHub cron is UTC and does NOT observe DST, and top-of-hour runs are
    # often delayed or dropped under load. So we fire several times through the
    # morning; the script sends on the FIRST fire at/after 7 AM London that
    # hasn't already sent today (marker committed back to the repo), and later
    # fires no-op. This is DST-safe and self-heals if a slot is dropped.
    - cron: "0 6 * * *"   # 07:00 BST / 06:00 GMT
    - cron: "0 7 * * *"   # 08:00 BST / 07:00 GMT
    - cron: "0 8 * * *"   # 09:00 BST / 08:00 GMT (catch-up)
  workflow_dispatch: {}   # manual "Run workflow" sends immediately

permissions:
  contents: write   # allow committing the send marker back

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Materialise config.yaml from the CONFIG_YAML variable
        env:
          CONFIG_YAML: ${{ vars.CONFIG_YAML }}
        run: |
          # config.yaml is gitignored (personal). Write it from the repo
          # variable at runtime; if unset, the app falls back to
          # config.example.yaml and errors clearly on the placeholder email.
          if [ -n "$CONFIG_YAML" ]; then
            printf '%s' "$CONFIG_YAML" > config.yaml
            echo "Wrote config.yaml from CONFIG_YAML variable."
          else
            echo "CONFIG_YAML variable not set — using config.example.yaml."
          fi

      - name: Build and send digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Optional — enables Reddit as a source. Omit and Reddit is skipped.
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        # Manual "Run workflow" sends immediately (--force, no marker);
        # scheduled runs use the once-per-day send gate.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m digest.main --force
          else
            python -m digest.main
          fi

      - name: Persist send marker
        if: github.event_name != 'workflow_dispatch'
        run: |
          git add state/last_sent state/seen_urls.json 2>/dev/null || true
          if git diff --cached --quiet -- state/last_sent state/seen_urls.json; then
            echo "No state change — nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: record digest sent $(date -u +%F)"
            git push
          fi
