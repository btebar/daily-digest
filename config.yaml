# ─────────────────────────────────────────────────────────────
# Daily Digest configuration
# Edit this file to change topics, sources, delivery, and model.
# ─────────────────────────────────────────────────────────────

email:
  to: blancatjm@gmail.com
  # The "from" address MUST be on a domain you've verified in Resend
  # (or use onboarding@resend.dev for testing — it can only send to your own
  # Resend account email). See README for setup.
  from: "onboarding@resend.dev"
  subject_prefix: "🧠 Daily Digest"

send_time:
  hour: 7                 # 7 AM...
  timezone: Europe/London # ...UK time (DST-safe; see main.py)

curation:
  model: gemini-flash-latest  # alias that tracks the current stable Flash;
                              # use gemini-pro-latest for sharper curation.
                              # Run `python -m digest.list_models` to see exactly
                              # which model names your API key supports.
  max_items: 12           # max items in the email
  lookback_hours: 30      # only consider items published in this window
  # Guidance handed to the model about what "notable" means for YOU.
  notability: >
    Prioritise genuinely novel results, strong empirical work, influential
    threads, and launches that a researcher working on these topics would
    want to know about today. Deprioritise incremental papers, marketing,
    and rehashes. It's fine to return fewer than max_items if little is notable.

# Your interests, in your own words. The model reads these verbatim.
topics:
  - AI coaching (LLMs as coaches / advisors / tutors)
  - User simulations and simulated users for evaluating agents
  - Benchmarks and evaluations for LLMs and agents
  - Reward hacking and specification gaming
  - Long-horizon tasks, planning, and long-horizon simulations
  - Evolving / dynamic / learned reward functions
  - AI for fitness, exercise, and physical training
  - AI for health and healthcare
  - AI for women's health (femtech, reproductive/hormonal health)
  - LLM agents (tool use, multi-agent, autonomy)
  - Long-term memory for AI / agents

sources:
  # Research papers — pulled from the arXiv API by category.
  arxiv:
    categories:
      - cs.AI   # Artificial Intelligence
      - cs.CL   # Computation & Language (NLP / LLMs)
      - cs.LG   # Machine Learning
      - cs.MA   # Multi-Agent Systems
      - cs.HC   # Human-Computer Interaction (coaching, health UX)
    max_results: 80   # newest N papers across the categories above

  # News, articles, blogs, newsletters, and release feeds (RSS/Atom).
  # Add or remove freely — anything with a feed URL works.
  rss:
    - name: Google DeepMind Blog
      url: https://deepmind.google/blog/rss.xml
    - name: OpenAI News
      url: https://openai.com/news/rss.xml
    - name: Hugging Face Blog
      url: https://huggingface.co/blog/feed.xml
    - name: Simon Willison (LLMs)
      url: https://simonwillison.net/atom/everything/
    - name: MIT Technology Review — AI
      url: https://www.technologyreview.com/topic/artificial-intelligence/feed
    - name: The Verge — AI
      url: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
    - name: VentureBeat — AI
      url: https://venturebeat.com/category/ai/feed/
    - name: WIRED — AI
      url: https://www.wired.com/feed/tag/ai/latest/rss
    - name: Ars Technica — AI
      url: https://arstechnica.com/ai/feed/
    - name: Import AI (Jack Clark)
      url: https://importai.substack.com/feed
    - name: Nature Machine Intelligence
      url: https://www.nature.com/natmachintell.rss
    - name: Science — News
      url: https://www.science.org/rss/news_current.xml
    - name: STAT News — Health Tech
      url: https://www.statnews.com/category/health-tech/feed/
    - name: TechCrunch — Femtech
      url: https://techcrunch.com/tag/femtech/feed/
    # Example GitHub releases feed (uncomment / edit for repos you follow):
    # - name: vLLM releases
    #   url: https://github.com/vllm-project/vllm/releases.atom

  # Reddit — top posts of the day from each subreddit, via the official API.
  # Requires REDDIT_CLIENT_ID + REDDIT_CLIENT_SECRET (see README). If those
  # aren't set, Reddit is simply skipped. Remove any subs you don't want.
  reddit:
    top_period: day   # hour | day | week
    per_sub: 12
    subreddits:
      - MachineLearning
      - LocalLLaMA
      - artificial
      - QuantifiedSelf
      - femtech
